<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- style-src allows inline styles because Vite dev injects CSS via <style>
         tags; the packaged build enforces the strict header CSP from
         renderer-protocol.ts on top of this meta, where styles load as files. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' ws:; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Mental LEGOs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/index.tsx"></script>
  </body>
</html>
